name: Build Windows x64 Installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: 'AeroClean-Windows/package-lock.json'
      continue-on-error: true # in case package-lock.json doesn't exist yet

    - name: Install Node.js Dependencies
      run: |
        cd AeroClean-Windows
        npm install

    - name: Build Windows Executable and Installer (MSI/EXE)
      run: |
        cd AeroClean-Windows
        npm run build
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          AeroClean-Windows/dist/AeroClean Setup *.exe
          AeroClean-Windows/dist/AeroClean *.msi
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


